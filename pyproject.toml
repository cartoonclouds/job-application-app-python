# Global options:

# https://toml.io/en/v1.0.0
# https://www.python.org/dev/peps/pep-0518/
# https://martin-thoma.com/pyproject-toml/
# https://peps.python.org/pep-0621/

# https://linuxhint.com/read_write_toml_files_python/

[project]
name = "JAA"
version = "0.1.0"
description = "An application to keep track of job applications."
author = "Chris Tudhope <cartoonclouds@gmail.com>"
license = "MIT"
readme = "README.md"
python = "^3.6"
homepage = "https://github.com/cartooncloudware/jaa"
repository = "https://github.com/cartooncloudware/jaa"
documentation = "https://github.com/cartooncloudware/jaa"

keywords = ["jobs", "applications", "registry"]

classifiers = [
    "Topic :: Utilties"
]

# Requirements
[dependencies]
# Click = "^7.0"

[dev-dependencies]
# mypy
# black = { version = "^18.3-alpha.0", python = "^3.6" }

# [build-system]
# requires = [
#     "setuptools >= 35.0.2",
#     "setuptools_scm >= 2.0.0, <3"
# ]
# build-backend = "setuptools.build_meta"


[tool.pytest.ini_options]
# https://docs.pytest.org/en/6.2.x/example/simple.html
# https://docs.pytest.org/en/6.2.x/reference.html#ini-options-ref
# https://docs.pytest.org/en/6.2.x/customize.html#pyproject-toml
usefixtures = 'job_application'
addopts = '-s'

# mypy global options:
[tool.mypy]
# https://mypy.readthedocs.io/en/stable/config_file.html
# https://mypy.readthedocs.io/en/stable/config_file.html#using-a-pyproject-toml-file
ignore_missing_imports = true
show_error_codes = true # https://mypy.readthedocs.io/en/stable/error_codes.html
mypy_path = 'src'
show_column_numbers = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

# Ignore the following imports because they have no types available.
[mypy-pytest]
ignore_missing_imports = true

# mypy per-module options:
[[tool.mypy.overrides]]
module = ['orator', 'orator.*']
follow_imports_for_stubs = false


[tool.pyright]
# https://github.com/microsoft/pylance-release
# https://github.com/microsoft/pyright/blob/main/docs/configuration.md
# https://github.com/microsoft/pylance-release/blob/main/DIAGNOSTIC_SEVERITY_RULES.md
# https://github.com/microsoft/pyright
root = ['app']
include = ["app"]
exclude = ["**/node_modules", "**/__pycache__"]

useLibraryCodeForTypes = true

reportMissingImports = "information"
reportMissingTypeStubs = "information"
reportUnknownMemberType = "information"